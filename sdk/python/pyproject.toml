[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-network"
version = "0.1.0"
description = "Python SDK for Agent Commerce Protocol (ACP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Open Agent Network Team"}
]
dependencies = [
    "httpx>=0.27.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/open-agent-network/open-agent-network"
