name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-contracts:
    name: Smart Contracts Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Test Smart Contracts
        run: |
          cd contracts
          npm install
          npm test

  test-typescript-sdk:
    name: TypeScript SDK Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm install
          npm test

  test-backend-api:
    name: Fastify REST API Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Test Fastify API
        run: |
          cd api
          npm install
          npm test

  build-frontend:
    name: Next.js Frontend Web Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Build Next.js Frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  test-python-sdk:
    name: Python SDK Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & Test Python SDK
        run: |
          cd sdk/python
          uv venv
          uv pip install -e . pytest
          uv run pytest
