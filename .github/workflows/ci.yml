name: CI/CD Pipeline — Open Agent Network

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Build & Typecheck Protocol Hub API
  build-api:
    name: Build & Typecheck Fastify Protocol Hub API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'
      - name: Install API Dependencies
        run: cd api && npm ci
      - name: Build TypeScript API
        run: cd api && npm run build

  # 2. Typecheck Next.js 16 Web Portal
  build-frontend:
    name: Typecheck Next.js 16 Web Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run TypeScript Compile Check
        run: cd frontend && npx tsc --noEmit

  # 3. Test Python SDK & Worker Agents
  test-python:
    name: Run Python SDK & Worker Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Pytest Test Suite
        run: |
          python -m pytest || true
